name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: setup-uv
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.1"
      - uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: "v0.5.6"

  test:
    runs-on: ubuntu-latest
    env:
      # for PRs: target branch, otherwise the branch name
      HEAD_REF: ${{ github.head_ref || github.ref_name }}
      # for PRs: the PR branch, otherwise the previous commit to simulate updating from an earlier version
      BASE_REF: ${{ github.base_ref || 'HEAD~1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        id: setup-uv
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.1"
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          # renovate: datasource=docker depName=docker/compose-bin
          version: "v5.5.1"
      - name: Test template using copier-template-tester
        run: |
          ./ctt.sh

      - name: Test "copier copy"
        run: |
          uvx copier copy --vcs-ref "$BASE_REF" \
            --data-file .github/answers.yaml \
            ${{ github.server_url }}/${{ github.repository }}.git /tmp/test
      - name: Test "copier update"
        run: |
          cd /tmp/test
          cat .copier-answers.yml
          git init
          git config user.email "test@example.com"
          git config user.name "test"
          git add .
          git commit -m "Initial commit"
          uvx copier update --skip-answered --vcs-ref "$HEAD_REF"
